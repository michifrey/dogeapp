name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # to publish the APK to the "latest" release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Same signature for every build (so updates install). Set the repository secrets
      # DOGE_KEYSTORE_BASE64 and DOGE_KEYSTORE_PASSWORD; without them the debug key is used.
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.DOGE_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.DOGE_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PW" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/doge.keystore"
            echo "DOGE_KEYSTORE_FILE=$RUNNER_TEMP/doge.keystore" >> "$GITHUB_ENV"
            echo "DOGE_KEYSTORE_PASSWORD=$KEYSTORE_PW" >> "$GITHUB_ENV"
            echo "Signing with the fixed Dog-E key"
          else
            echo "::warning::DOGE_KEYSTORE_* secrets missing – signing with a random debug key (updates will not install over older builds)"
          fi
      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dog-e-control-debug
          path: app/build/outputs/apk/debug/*.apk

      # Fixed download link for the README:
      # https://github.com/<owner>/<repo>/releases/latest/download/dog-e-control.apk
      - name: Publish APK to release "latest"
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk dog-e-control.apk
          NOTES="Neueste Version von Dog-E Control – Stand ${GITHUB_SHA::7} ($(date -u +'%d.%m.%Y %H:%M') UTC, Branch ${GITHUB_REF_NAME}). Installieren: dog-e-control.apk auf dem Handy/Tablet öffnen."
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --title "Dog-E Control (neueste Version)" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
          gh release upload latest dog-e-control.apk --clobber
          gh release edit latest --notes "$NOTES"
